site_name: jaxglitches
site_description: Differentiable LISA glitch waveforms and inference utilities
site_url: https://jaxglitches.github.io/jaxglitches/
repo_url: https://github.com/jaxglitches/jaxglitches
repo_name: jaxglitches/jaxglitches
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/branding/jaxglitches-icon.svg
  favicon: assets/branding/jaxglitches-icon.png
  palette:
    primary: indigo
    accent: amber
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Example notebook: example.md
  - Research notebooks:
      - Overview: gallery.md
      - Equal versus unequal arms: notebook-gallery/unequal_vs_equal_arm.md
      - Published comparisons: notebook-gallery/compare_other_codes.md
      - Exact versus hybrid: notebook-gallery/exact_vs_hybrid.md
      - Short glitches: notebook-gallery/short_glitch.md
      - Raw response and TDI: notebook-gallery/raw_and_tdi_tests.md
  - Conventions: conventions.md
  - GPU: gpu.md
  - Paper reproduction: reproducing-paper.md
  - API reference: api.md
  - Development and releases: development.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 2
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
